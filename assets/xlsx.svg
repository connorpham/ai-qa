<svg width="880" height="330" viewBox="0 0 880 330" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="330" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="42" font-size="16" font-weight="700" fill="#e6edf3">The spreadsheet everyone else reads</text>
  <text x="40" y="64" font-size="12" fill="#8b949e">ISO/IEC/IEEE 29119-3 · IEEE-829 fields · pure Python stdlib · byte-deterministic</text>

  <!-- window -->
  <rect x="40" y="84" width="800" height="212" rx="8" fill="#161b22" stroke="#30363d"/>
  <!-- sheet tabs -->
  <g transform="translate(40,84)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#21713a"/>
    <text x="70" y="20" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Summary</text>
    <text x="230" y="20" font-size="12" fill="#8b949e" text-anchor="middle">Test Cases</text>
    <text x="380" y="20" font-size="12" fill="#8b949e" text-anchor="middle">Defects</text>
    <text x="530" y="20" font-size="12" fill="#8b949e" text-anchor="middle">Traceability</text>
    <text x="680" y="20" font-size="12" fill="#8b949e" text-anchor="middle">Evidence</text>
  </g>
  <line x1="40" y1="114" x2="840" y2="114" stroke="#30363d"/>

  <!-- summary sheet mock -->
  <g transform="translate(64,140)" font-size="12.5">
    <text x="0" y="0" fill="#8b949e">Ticket</text>
    <text x="180" y="0" fill="#e6edf3">SHOP-142</text>
    <text x="0" y="26" fill="#8b949e">Verdict</text>
    <text x="180" y="26" fill="#f85149" font-weight="700">FAIL — 1 defect</text>
    <text x="0" y="52" fill="#8b949e">Worst severity</text>

    <!-- severity ladder -->
    <g transform="translate(180,40)">
      <rect x="0" y="0" width="86" height="20" rx="4" fill="#3d1417" stroke="#f85149"/>
      <text x="43" y="14" font-size="11" fill="#ff7b72" text-anchor="middle">Blocker 0</text>
      <rect x="96" y="0" width="86" height="20" rx="4" fill="#3d1417" stroke="#f85149"/>
      <text x="139" y="14" font-size="11" fill="#ff7b72" text-anchor="middle">Critical 0</text>
      <rect x="192" y="0" width="86" height="20" rx="4" fill="#2b2410" stroke="#d29922"/>
      <text x="235" y="14" font-size="11" fill="#e3b341" text-anchor="middle">Major 1</text>
      <rect x="288" y="0" width="86" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="331" y="14" font-size="11" fill="#8b949e" text-anchor="middle">Minor 0</text>
    </g>

    <text x="0" y="92" fill="#8b949e">Declared unknowns</text>
    <text x="180" y="92" fill="#6e7681">2 fields — printed NOT DECLARED, never guessed</text>

    <text x="0" y="118" fill="#8b949e">Ungraded cases</text>
    <text x="180" y="118" fill="#e6edf3">0 — a failed case with no SEVERITY is counted, never coloured</text>
  </g>

  <text x="40" y="320" font-size="11.5" fill="#6e7681">It never invents a value · it adds nothing the pack does not declare · it says so when the pack contradicts itself.</text>
</svg>
